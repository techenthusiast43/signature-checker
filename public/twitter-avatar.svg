<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="60%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </radialGradient>

    <!-- Outer Glow -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="innerShield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#060c18" stop-opacity="0.98" />
    </linearGradient>

    <!-- Check & Quill Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Base (Perfect for Twitter Avatar) -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)" />

  <!-- Ambient Ambient Glow Ring -->
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#glowGrad)" stroke-width="2" opacity="0.4" />
  <circle cx="256" cy="256" r="216" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3" />

  <!-- Background Cyber Circuit Grid Accent -->
  <path d="M 120 256 L 150 256 L 180 290" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.25" />
  <circle cx="120" cy="256" r="4" fill="#06b6d4" opacity="0.4" />
  <path d="M 392 256 L 362 256 L 332 222" fill="none" stroke="#0284c7" stroke-width="2" opacity="0.25" />
  <circle cx="392" cy="256" r="4" fill="#06b6d4" opacity="0.4" />

  <!-- Outer Cryptographic Shield Contour -->
  <path d="M 256 86
           C 340 86 376 112 376 190
           C 376 300 286 384 256 414
           C 226 384 136 300 136 190
           C 136 112 172 86 256 86 Z"
        fill="none"
        stroke="url(#shieldGrad)"
        stroke-width="14"
        stroke-linejoin="round"
        filter="url(#subtleGlow)" />

  <!-- Inner Dark Shield Body -->
  <path d="M 256 98
           C 330 98 362 120 362 192
           C 362 290 282 368 256 396
           C 230 368 150 290 150 192
           C 150 120 182 98 256 98 Z"
        fill="url(#innerShield)"
        stroke="#1e293b"
        stroke-width="2" />

  <!-- Signature Arc / Digital Ribbon -->
  <path d="M 174 278
           C 210 320 260 326 320 284
           C 344 266 356 240 338 214
           C 320 188 280 206 280 236
           C 280 258 298 274 324 272"
        fill="none"
        stroke="#0e7490"
        stroke-width="5"
        stroke-linecap="round"
        opacity="0.45" />

  <!-- Dynamic Verified Checkmark & Stylized Signature Quill -->
  <!-- Long swoop & check -->
  <path d="M 200 248
           L 242 296
           C 246 300 252 300 256 295
           L 332 174"
        fill="none"
        stroke="url(#checkGrad)"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#neonGlow)" />

  <!-- Sharp Quill / Nib Accent at the top of the checkmark -->
  <path d="M 332 174
           L 350 148
           C 352 145 356 146 356 150
           L 346 178
           Z"
        fill="#38bdf8"
        filter="url(#neonGlow)" />

  <!-- Cryptographic Proof Points / Nodes -->
  <circle cx="256" cy="130" r="5" fill="#22d3ee" filter="url(#subtleGlow)" />
  <circle cx="200" cy="248" r="6" fill="#38bdf8" />
  <circle cx="242" cy="296" r="5" fill="#22d3ee" />

  <!-- Bottom Crest Embellishment -->
  <circle cx="256" cy="364" r="4" fill="#06b6d4" opacity="0.8" />
</svg>

